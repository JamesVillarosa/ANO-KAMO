[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ano-kamo-backend"
version = "0.1.0"
description = "AI-powered Filipino language translation backend"
authors = [
    {name = "Ano-Kamo Team", email = "team@ano-kamo.dev"}
]
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "fastapi==0.109.0",
    "uvicorn[standard]==0.27.0",
    "pydantic==2.5.3",
    "pydantic-settings==2.1.0",
    "sqlalchemy==2.0.23",
    "alembic==1.13.1",
    "httpx==0.25.2",
    "python-dotenv==1.0.0",
    "python-multipart==0.0.6",
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.4",
    "pytest-cov==4.1.0",
    "pytest-asyncio==0.23.2",
    "black==23.12.1",
    "isort==5.13.2",
    "flake8==6.1.0",
    "pylint==3.0.3",
    "mypy==1.7.1",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --strict-markers"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
